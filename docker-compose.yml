version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pokemon_postgres
    restart: always
    environment:
      POSTGRES_USER: pokemon_user
      POSTGRES_PASSWORD: pokemon_secure_password_2026
      POSTGRES_DB: pokemon_db
    ports:
      - "5432:5432"
    volumes:
      - pokemon_pgdata:/var/lib/postgresql/data

volumes:
  pokemon_pgdata:
